[package]
name = "enumerator"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["merl <merl.001.mia@gmail.com>"]
description = "Recursive enum variant enumerator"

repository = "https://github.com/merl-twin/enumerator"
homepage = "https://github.com/merl-twin/enumerator"

include = [
    "**/*.rs",
    "Cargo.toml",
]

[dependencies]
enumerator-derive = { version = "0.1", path = "./derive" }

[workspace]
members = [
    "derive",
]
